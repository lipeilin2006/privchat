# PrivChat 工作区：统一三个 crate 的依赖解析与编译缓存。
#
# 成员：
# - privchat-client/src-tauri : Tauri 应用（Android / 桌面客户端）
# - privchat-common           : mailbox 客户端 / 节点共享 wire 协议与 PoW
# - privchat-mailbox          : 离线消息缓存节点（可组网同步）
#
# release profile 只能在 workspace 根生效，统一放在这里避免成员配置被忽略。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 必须是 unwind，不能是 abort：
# 1. iroh-dns 在安卓上靠 catch_unwind 兜住「ndk_context 没初始化」的 panic，
#    换成 abort 就是第一次 DNS 查询直接死；
# 2. 客户端 run() 也用 catch_unwind 接启动期 panic，弹 Toast 而不是静默闪退。
panic = "unwind"
strip = true

[workspace]
resolver = "2"
members = [
    "privchat-client/src-tauri",
    "privchat-common",
    "privchat-mailbox",
    "privchat-onion",
]
